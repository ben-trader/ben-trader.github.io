<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Ben Trader</title>
  <meta name="description" content="Contact details and simple inquiry form for Ben Trader.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portfolio.css">
</head>
<body class="theme-dusk">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header>
    <div class="wrapper site-header">
      <a class="brand" href="wa4.html">Ben Trader</a>
      <nav aria-label="Primary">
        <ul>
          <li><a href="wa4.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="wrapper">
      <h1>Contact</h1>

      <section aria-labelledby="connect-heading">
        <h2 id="connect-heading">Let’s Connect</h2>
        <p>
          I’m open to feedback, collaboration, and project critiques. Use the form below to send a quick message.
        </p>
        <form action="#" method="post">
          <fieldset>
            <legend>Send a message</legend>

            <div>
              <label for="name">Name</label>
              <input id="name" name="name" type="text" required>
            </div>

            <div>
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required>
            </div>

            <div>
              <label for="topic">Topic</label>
              <select id="topic" name="topic">
                <option value="feedback">Portfolio feedback</option>
                <option value="collab">Collaboration</option>
                <option value="question">Question</option>
              </select>
            </div>

            <div>
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="6" required></textarea>
            </div>

            <button type="submit">Send</button>
          </fieldset>
        </form>
      </section>
    </div>
  </main>

  <div class="wrapper">
    <aside>
      <h2>Other Links</h2>
      <ul>
        <li><a href="projects.html">See Projects</a></li>
        <li><a href="about.html">Read About me</a></li>
      </ul>
    </aside>
  </div>

  <footer>
    <div class="wrapper site-footer">
      <p>© <time datetime="2025">2025</time> Ben Trader.</p>
    </div>
  </footer>
</body>
</html>
